[book]
title = "AI 工程實作：從 Skill、MCP 到 RAG、LoRA 與自架模型"
authors = ["Vic Huang"]
language = "zh-TW"
src = "src"

[build]
build-dir = "book"

[output.html]
additional-css = ["theme/custom.css"]
default-theme = "light"
preferred-dark-theme = "navy"
no-section-label = true
site-url = "/ai-build/"

[output.html.fold]
enable = true
level = 1
