[book]
title = "AI 怎麼運作：從機器學習到語言模型的直覺課"
authors = ["Vic Huang"]
language = "zh-TW"
src = "src"

[build]
build-dir = "book"

[output.html]
additional-css = ["theme/custom.css"]
default-theme = "light"
preferred-dark-theme = "navy"
no-section-label = true
site-url = "/ai-theory/"

[output.html.fold]
enable = true
level = 1
