[book]
title = "動手玩機械與 3D 列印：從齒輪到自己設計零件"
authors = ["Vic Huang"]
language = "zh-TW"
src = "src"

[build]
build-dir = "book"

[output.html]
additional-css = ["theme/custom.css"]
default-theme = "light"
preferred-dark-theme = "navy"
no-section-label = true
site-url = "/mech/"

[output.html.fold]
enable = true
level = 1
