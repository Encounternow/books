[book]
title = "英文自學地圖：國中生的英文學習法與練習本"
authors = ["Vic Huang"]
language = "zh-TW"
src = "src"

[build]
build-dir = "book"

[output.html]
additional-css = ["theme/custom.css"]
default-theme = "light"
preferred-dark-theme = "navy"
no-section-label = true
site-url = "/english/"

[output.html.fold]
enable = true
level = 1
