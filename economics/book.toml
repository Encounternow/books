[book]
title = "生活經濟學：從零用錢看懂世界怎麼運作"
authors = ["Vic Huang"]
language = "zh-TW"
src = "src"

[build]
build-dir = "book"

[output.html]
additional-css = ["theme/custom.css"]
default-theme = "light"
preferred-dark-theme = "navy"
no-section-label = true
site-url = "/economics/"

[output.html.fold]
enable = true
level = 1
